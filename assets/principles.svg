<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="138" viewBox="0 0 1000 138" role="img" aria-label="principles.svg: Offline-first Local Hive storage synced with Supabase, so apps work without signal.; Tested Unit and widget tests run in CI on every push and pull request.; Shippable Release workflow that builds and deploys to the Play Store on demand.; Clean history Git history audited for secrets before repos go public.">
<style>
:root{--bd:#D0D7DE;--tx:#1F2328;--mu:#59636E;--dm:#6E7781}
@media (prefers-color-scheme: dark){:root{--bd:#30363D;--tx:#E6EDF3;--mu:#9DA7B3;--dm:#7D8590}}
.bd{fill:none;stroke:var(--bd)}
.dv{stroke:var(--bd);opacity:.7}
.tx{fill:var(--tx)}
.mu{fill:var(--mu)}
.dm{fill:var(--dm)}
.ic{fill:var(--l)}
@media (prefers-color-scheme: dark){.ic{fill:var(--d)}}
</style>
<rect x="0.75" y="0.75" width="236.5" height="136.5" rx="14" class="bd" stroke-width="1.5"/>
<text x="24.0" y="40" class="tx" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700">Offline-first</text>
<text x="24.0" y="66" class="mu" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400">Local Hive storage synced</text>
<text x="24.0" y="86" class="mu" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400">with Supabase, so apps</text>
<text x="24.0" y="106" class="mu" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400">work without signal.</text>
<rect x="254.75" y="0.75" width="236.5" height="136.5" rx="14" class="bd" stroke-width="1.5"/>
<text x="278.0" y="40" class="tx" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700">Tested</text>
<text x="278.0" y="66" class="mu" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400">Unit and widget tests run</text>
<text x="278.0" y="86" class="mu" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400">in CI on every push and</text>
<text x="278.0" y="106" class="mu" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400">pull request.</text>
<rect x="508.75" y="0.75" width="236.5" height="136.5" rx="14" class="bd" stroke-width="1.5"/>
<text x="532.0" y="40" class="tx" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700">Shippable</text>
<text x="532.0" y="66" class="mu" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400">Release workflow that builds</text>
<text x="532.0" y="86" class="mu" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400">and deploys to the Play</text>
<text x="532.0" y="106" class="mu" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400">Store on demand.</text>
<rect x="762.75" y="0.75" width="236.5" height="136.5" rx="14" class="bd" stroke-width="1.5"/>
<text x="786.0" y="40" class="tx" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700">Clean history</text>
<text x="786.0" y="66" class="mu" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400">Git history audited for</text>
<text x="786.0" y="86" class="mu" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400">secrets before repos</text>
<text x="786.0" y="106" class="mu" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400">go public.</text>
</svg>

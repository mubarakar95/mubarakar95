<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="138" viewBox="0 0 1000 138" role="img" aria-label="principles.svg">
<rect x="0.8" y="0.75" width="236.5" height="136.5" rx="14" fill="#0A0A0A" stroke="#2A2A2A" stroke-width="1.5"/>
<text x="24.0" y="40" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">Offline-first</text>
<text x="24.0" y="66" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#A3A3A3">Local Hive storage synced</text>
<text x="24.0" y="86" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#A3A3A3">with Supabase, so apps</text>
<text x="24.0" y="106" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#A3A3A3">work without signal.</text>
<rect x="254.8" y="0.75" width="236.5" height="136.5" rx="14" fill="#0A0A0A" stroke="#2A2A2A" stroke-width="1.5"/>
<text x="278.0" y="40" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">Tested</text>
<text x="278.0" y="66" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#A3A3A3">Unit and widget tests run</text>
<text x="278.0" y="86" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#A3A3A3">in CI on every push and</text>
<text x="278.0" y="106" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#A3A3A3">pull request.</text>
<rect x="508.8" y="0.75" width="236.5" height="136.5" rx="14" fill="#0A0A0A" stroke="#2A2A2A" stroke-width="1.5"/>
<text x="532.0" y="40" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">Shippable</text>
<text x="532.0" y="66" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#A3A3A3">Release workflow that builds</text>
<text x="532.0" y="86" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#A3A3A3">and deploys to the Play</text>
<text x="532.0" y="106" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#A3A3A3">Store on demand.</text>
<rect x="762.8" y="0.75" width="236.5" height="136.5" rx="14" fill="#0A0A0A" stroke="#2A2A2A" stroke-width="1.5"/>
<text x="786.0" y="40" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">Clean history</text>
<text x="786.0" y="66" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#A3A3A3">Git history audited for</text>
<text x="786.0" y="86" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#A3A3A3">secrets before repos</text>
<text x="786.0" y="106" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#A3A3A3">go public.</text>
</svg>